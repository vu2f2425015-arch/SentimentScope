# fly.toml app configuration file for SentimentScope API
# Configured for deployment on Fly.io

app = "sentimentscope-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  MODELS_DIR = "models"
  REPORTS_DIR = "reports"
  ENABLE_LIVE_INGESTION = "true"
  INGESTION_DB_PATH = "/app/data/rolling_store.db"
  ALLOWED_ORIGINS = "https://sentimentscope.vercel.app,http://localhost:3000"

[mounts]
  source = "sentimentscope_data"
  destination = "/app/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "15s"
    method = "get"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
